name: CI

# This repository had no CI at all.
#
# The GOOS list below was measured on this module, not copied: every pair was
# cross-built locally first, and `go test -race` was run. A matrix written
# from a template rather than from measurement lands red on its first run, and
# a red lane nobody reads is how a sibling repo (weft-microvm-agent) kept a
# broken linux build for weeks while darwin and the BSDs went green.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
      - run: go vet ./...
      - run: go test -count=1 ./...

  race:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
      - run: go test -race -count=1 ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
        goos:
          - linux
          - darwin
          - freebsd
          - openbsd
          - netbsd
          - windows
        goarch: [amd64, arm64]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...

  # The jobs above run the tests on linux/amd64 only. The ioctl request
  # numbers are not the same on every architecture: powerpc and mips use their
  # own _IOC layout (13 size bits, 3 dir bits, NONE=1 READ=2 WRITE=4), and this
  # package encoded the asm-generic one everywhere without any lane noticing.
  # These lanes run the test binaries on one architecture of each of those two
  # families, so TestIoctlAgainstXSys judges the numbers where they differ.
  # mips64le runs on bookworm because trixie dropped mips64el.
  emulated:
    name: emulated (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ppc64le
            image: debian:trixie
            qemu_cpu: "power9"
          - arch: mips64le
            image: debian:bookworm
            qemu_cpu: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up binfmt (QEMU)
        run: docker run --rm --privileged tonistiigi/binfmt --install all
      - name: Cross-compile per-package test binaries
        run: |
          set -euo pipefail
          mkdir -p testbins
          for pkg in $(go list ./...); do
            name=$(echo "$pkg" | tr '/' '_')
            # Skip packages that genuinely have no test files; everything else
            # MUST compile, or the lane would pass having tested nothing.
            hastests=$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}yes{{end}}' "$pkg")
            if [ -z "$hastests" ]; then
              echo "no test files for $pkg, skipping"
              continue
            fi
            echo "Compiling test binary for $pkg"
            CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
              go test -c -o "testbins/${name}.test" "$pkg"
          done
          ls -l testbins
      - name: Run test binaries under QEMU (${{ matrix.arch }})
        env:
          QEMU_CPU: ${{ matrix.qemu_cpu }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(testbins/*.test)
          test ${#bins[@]} -gt 0 || { echo "::error::no test binary was built"; exit 1; }
          for bin in "${bins[@]}"; do
            echo "::group::Running $bin on linux/${{ matrix.arch }}"
            docker run --rm --platform linux/${{ matrix.arch }} \
              ${QEMU_CPU:+-e QEMU_CPU="$QEMU_CPU"} \
              -v "$PWD":/work -w /work \
              ${{ matrix.image }} \
              "/work/$bin" -test.v -test.short
            echo "::endgroup::"
          done
